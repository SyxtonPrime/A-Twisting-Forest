<!doctype html><meta charset="utf-8"><title>pieces lab</title>
<style>body{margin:0;background:#f4efe6;display:flex;flex-wrap:wrap;gap:6px;padding:6px}
canvas{border:1px solid #d9d0c1}</style>
<div id="g" style="display:flex;flex-wrap:wrap;gap:6px"></div>
<script type="module">
import { drawPieces } from './src/pieces.js';
const H='handle', C='crosscap';
const cases = [[C],[H],[H,C],[H,H,C],[C,C,C],[H,H,H,C],[H,C,C,H,H],[H,H,C,C,H,C],[H,C,H,C,H,C,H,C]];
for (const c of cases) {
  const cv = document.createElement('canvas');
  document.getElementById('g').appendChild(cv);
  drawPieces(cv, c, 300, 300);
}
document.title = 'PIECES OK';
</script>
