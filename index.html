<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>A Twisting Forest</title>
<meta name="description" content="You walk in the dark until the paths start repeating. What you agree to becomes the shape of the world.">
<meta name="theme-color" content="#f4efe6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Twisting Forest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game">
  <section id="left">
    <section id="log" aria-live="polite"></section>
    <section id="act"></section>
  </section>
  <aside id="side">
    <section id="mapwrap" hidden>
      <canvas id="sketch"></canvas>
      <p class="cap">what you remember</p>
    </section>
    <div class="stat"><span>food</span><b id="supplies"></b></div>
    <div class="stat"><span>hours walked</span><b id="steps"></b></div>
    <div class="stat"><span>loops closed</span><b id="loops"></b></div>
    <div class="stat"><span>seed</span><b id="seed"></b></div>
    <div class="buttons">
      <button id="map" hidden>the map</button>
      <button id="lie-down">lie down</button>
      <button id="new-world">start again</button>
    </div>
  </aside>
</main>
<div id="overlay" hidden>
  <div id="stage">
    <canvas id="worldmap"></canvas>
    <canvas id="netsolid" hidden></canvas>
    <p id="stage-hint"></p>
  </div>
  <section id="reveal" hidden>
    <h1>the world</h1>
    <p id="reveal-name"></p>
    <p id="reveal-detail"></p>
    <p id="reveal-stats"></p>
    <div class="buttons">
      <button data-view="map">the map</button>
      <button data-view="net">the net</button>
      <button id="roll" hidden>unroll the net</button>
    </div>
    <div class="buttons">
      <button id="again">begin again</button>
      <button id="same">same seed</button>
    </div>
  </section>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
